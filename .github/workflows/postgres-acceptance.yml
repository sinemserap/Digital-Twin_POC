name: PostgreSQL acceptance

on:
  pull_request:
  push:
    branches:
      - main
      - codex/build-employee-digital-twin-poc-part-1

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, America/New_York]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edt
          POSTGRES_PASSWORD: edt
          POSTGRES_DB: edt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edt -d edt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - name: SQLite regression
        if: matrix.timezone == 'UTC'
        run: python -m pytest
      - name: Migrated PostgreSQL acceptance
        run: >-
          python -m pytest
          --postgres-url postgresql+psycopg://edt:edt@localhost:5432/edt_test
          --postgres-timezone ${{ matrix.timezone }}
