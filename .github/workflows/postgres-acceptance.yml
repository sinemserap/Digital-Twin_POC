name: PostgreSQL acceptance

on:
  pull_request:
  push:
    branches:
      - main
      - codex/build-employee-digital-twin-poc-part-1
      - f03-operational-graph-part1

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, America/New_York]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edt
          POSTGRES_PASSWORD: edt
          POSTGRES_DB: edt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edt -d edt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - name: SQLite regression
        if: matrix.timezone == 'UTC'
        run: python -m pytest
      - name: Migrated PostgreSQL acceptance
        run: >-
          python -m pytest
          --postgres-url postgresql+psycopg://edt:edt@localhost:5432/edt_test
          --postgres-timezone ${{ matrix.timezone }}
      - name: F03 deployed-service demonstration (uvicorn + migrated PostgreSQL + restricted roles)
        if: matrix.timezone == 'UTC'
        env:
          PGPASSWORD: edt
        run: |
          createdb -h localhost -U edt edt_demo
          for f in 001_initial 002_subject_restriction 003_controlled_import 004_operational_graph compose_roles; do
            psql -q -h localhost -U edt -d edt_demo -v ON_ERROR_STOP=1 -f migrations/$f.sql
          done
          DATABASE_URL=postgresql+psycopg://edt:edt@localhost:5432/edt_demo \
          IMPORT_DATABASE_URL=postgresql+psycopg://edt_f08:edt_f08@localhost:5432/edt_demo \
          GRAPH_DATABASE_URL=postgresql+psycopg://edt_f03:edt_f03@localhost:5432/edt_demo \
          EVIDENCE_DIR=/tmp/evidence python -m app &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          BASE_URL=http://localhost:8000 bash scripts/demo_f03.sh
