[project]
name = "edt-claim-evidence-service"
version = "0.1.0"
description = "Trusted claim and evidence core for the Employee Digital Twin PoC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "cryptography>=43,<46",
  "azure-storage-blob>=12.23,<13",
  "azure-keyvault-keys>=4.10,<5",
  "azure-identity>=1.19,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
